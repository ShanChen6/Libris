[project]
name = "libris-ai"
version = "0.1.0"
description = "Libris AI & Search Engine: RAG pipeline cho văn bản pháp luật Việt Nam"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "redis>=8.2.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
eval = [
    "langchain-openai>=1.8.5",
    "ragas>=0.4.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"eval/build_golden.py" = ["E501"]  # dữ liệu: mỗi câu hỏi một dòng cho dễ rà soát

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch bản CPU (không kéo theo thư viện CUDA vài GB). Máy có GPU: đổi index sang cu12x.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
